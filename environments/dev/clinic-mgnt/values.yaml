replicaCount: 1

image:
  repository: ghcr.io/whospiko/clinic-mgnt
  tag: "dev-sha-3d8bdd7"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

containerPort: 3000

service:
  type: ClusterIP
  port: 3000

config:

  NODE_ENV: development

  PORT: "3000"

  HOSTNAME: "0.0.0.0"

  BOOKING_API_URL: http://booking-service:3001/api

  PATIENT_API_URL: http://patient-service:3002/api

  NEXT_PUBLIC_BOOKING_API_URL: /api/booking

  NEXT_PUBLIC_PATIENT_API_URL: /api/patient

  NEXT_PUBLIC_CLINIC_TIMEZONE: Asia/Phnom_Penh

existingSecret: ""

health:
  enabled: true

  readinessPath: /
  livenessPath: /

  readinessInitialDelaySeconds: 5
  livenessInitialDelaySeconds: 15

resources:

  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

ingress:

  enabled: true

  className: traefik

  annotations: {}

  hosts:

    - host: dev-clinic.thecapy.org
      paths:

        - path: /
          pathType: Prefix

  tls: []