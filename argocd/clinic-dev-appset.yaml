apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: clinic-dev
  namespace: argocd

spec:
  goTemplate: true

  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/whospiko/clinic-gitops.git
        revision: main

        directories:
          - path: environments/dev/*

  template:

    metadata:
      name: 'dev-{{ .path.basename }}'

    spec:

      project: clinic

      source:
        repoURL: https://github.com/whospiko/clinic-gitops.git
        targetRevision: main

        path: charts/clinic-service

        helm:
          releaseName: '{{ .path.basename }}'

          valueFiles:
            - '../../{{ .path.path }}/values.yaml'

      destination:
        server: https://kubernetes.default.svc
        namespace: clinic-dev

      syncPolicy:

        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true